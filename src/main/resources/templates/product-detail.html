<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_layout}">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="/css/output.css" />
	<title>商品詳細</title>

	<style>
		.star-rating {
			position: relative;
			display: inline-block;
			font-size: 20px;
			line-height: 1;
			color: #ddd;
		}

		.star-rating::before {
			content: "★★★★★";
		}

		.star-rating::after {
			content: "★★★★★";
			position: absolute;
			left: 0;
			top: 0;
			width: var(--rating-percent);
			overflow: hidden;
			color: gold;
			white-space: nowrap;
		}
	</style>
</head>

<body>
	<div layout:fragment="content">

		<h1 th:text="${product.name}"></h1>

		<img th:src="${product.imageUrl}">

		<p>
			価格:
			<span th:text="${product.price}"></span>円
		</p>

		<p>送料: 800円</p>

		<p th:text="${product.description}"></p>

		<!-- 平均星表示 -->
		<div style="display:flex; align-items:center; gap:10px;">

			<span class="star-rating"
			      th:style="'--rating-percent:' + (${averageRating} * 20) + '%'">
			</span>

			<span th:text="${averageRating}"></span>

		</div>

		<a href="#review-section">レビューはこちら</a>

		<!-- カート追加 -->
		<form th:action="@{/products/{id}/cart(id=${product.id})}"
		      method="post">

			<input type="number"
			       name="quantity"
			       value="1"
			       min="1">

			<button type="submit">
				カートに追加
			</button>

		</form>

		<hr>

		<h2 id="review-section">レビュー</h2>

		<!-- レビュー並び替え -->
		<form th:action="@{/products/{id}(id=${product.id})}"
		      method="get">

			<label for="sort">並び順</label>

			<select id="sort" name="sort">

				<option value="new"
				        th:selected="${selectedSort == 'new'}">
					新しい順
				</option>

				<option value="old"
				        th:selected="${selectedSort == 'old'}">
					古い順
				</option>

				<option value="high"
				        th:selected="${selectedSort == 'high'}">
					評価が高い順
				</option>

				<option value="low"
				        th:selected="${selectedSort == 'low'}">
					評価が低い順
				</option>

			</select>

			<label for="rating">星の数</label>

			<select id="rating" name="rating">

				<option value=""
				        th:selected="${selectedRating == null}">
					すべて
				</option>

				<option value="5"
				        th:selected="${selectedRating == 5}">
					★5
				</option>

				<option value="4"
				        th:selected="${selectedRating == 4}">
					★4
				</option>

				<option value="3"
				        th:selected="${selectedRating == 3}">
					★3
				</option>

				<option value="2"
				        th:selected="${selectedRating == 2}">
					★2
				</option>

				<option value="1"
				        th:selected="${selectedRating == 1}">
					★1
				</option>

			</select>

			<button type="submit">
				表示を変更
			</button>

			<a th:href="@{/products/{id}(id=${product.id})}">
				条件をリセット
			</a>

		</form>

		<div th:if="${#lists.isEmpty(reviews)}">
			<p>条件に合うレビューはありません。</p>
		</div>

		<div th:each="review : ${reviews}">

			<p>
				投稿者：
				<span th:text="${review.username != null ? review.username : 'ゲスト'}">
				</span>
			</p>

			<div>

				<span th:each="i : ${#numbers.sequence(1,5)}">

					<span th:text="${i <= review.rating ? '★' : '☆'}">
					</span>

				</span>

			</div>

			<p th:if="${review.createdAt != null}">

				投稿日：
				<span th:text="${#temporals.format(review.createdAt, 'M月d日')}">
				</span>

			</p>

			<p th:text="${review.comment}"></p>

		</div>

		<hr>

		<h3>レビュー投稿</h3>

		<form th:action="@{/products/{id}/review(id=${product.id})}"
		      method="post"
		      th:object="${reviewForm}">

			<select th:field="*{rating}">

				<option value="1">★1</option>
				<option value="2">★2</option>
				<option value="3">★3</option>
				<option value="4">★4</option>
				<option value="5">★5</option>

			</select>

			<textarea th:field="*{comment}"
			          placeholder="レビューを入力してください">
			</textarea>

			<button type="submit">
				投稿
			</button>

		</form>

	</div>
</body>

</html>
