<h1 th:text="${product.productName}"></h1>

<img th:src="${product.imageUrl}">

<p>価格: <span th:text="${product.price}"></span>円</p>
<p>送料: 1000円</p>

<p th:text="${product.description}"></p>

<!-- 平均星表示 -->
<div>
	<span th:each="i : ${#numbers.sequence(1,5)}">
		<span th:text="${i <= averageRating ? '★' : '☆'}"></span>
	</span>
	(<span th:text="${averageRating}"></span>)
</div>

<a href="#review-section">レビューはこちら</a>

<!-- カート追加 -->
<form th:action="@{/product/{id}/cart(id=${product.productId})}" method="post">
	<input type="number" name="quantity" value="1" min="1">
	<button type="submit">カートに追加</button>
</form>

<hr>

<h2 id="review-section">レビュー</h2>

<!-- レビューの並び替え・星の数フィルタ -->
<form th:action="@{/product/{id}(id=${product.productId})}" method="get">
	<label for="sort">並び順</label>
	<select id="sort" name="sort">
		<option value="new" th:selected="${selectedSort == 'new'}">新しい順</option>
		<option value="old" th:selected="${selectedSort == 'old'}">古い順</option>
		<option value="high" th:selected="${selectedSort == 'high'}">評価が高い順</option>
		<option value="low" th:selected="${selectedSort == 'low'}">評価が低い順</option>
	</select>

	<label for="rating">星の数</label>
	<select id="rating" name="rating">
		<option value="" th:selected="${selectedRating == null}">すべて</option>
		<option value="5" th:selected="${selectedRating == 5}">★5</option>
		<option value="4" th:selected="${selectedRating == 4}">★4</option>
		<option value="3" th:selected="${selectedRating == 3}">★3</option>
		<option value="2" th:selected="${selectedRating == 2}">★2</option>
		<option value="1" th:selected="${selectedRating == 1}">★1</option>
	</select>

	<button type="submit">表示を変更</button>
	<a th:href="@{/product/{id}(id=${product.productId})}">条件をリセット</a>
</form>

<div th:if="${#lists.isEmpty(reviews)}">
	<p>条件に合うレビューはありません。</p>
</div>

<div th:each="review : ${reviews}">
	<div>
		<span th:each="i : ${#numbers.sequence(1,5)}">
			<span th:text="${i <= review.rating ? '★' : '☆'}"></span>
		</span>
	</div>

	<!-- レビュー投稿日表示：既存のcreated_atを使うためDB設計の変更は不要 -->
	<p th:if="${review.createdAt != null}">
		投稿日：<span th:text="${#temporals.format(review.createdAt, 'M月d日')}"></span>
	</p>

	<p th:text="${review.comment}"></p>
</div>

<hr>

<h3>レビュー投稿</h3>

<form th:action="@{/product/{id}/review(id=${product.productId})}" method="post" th:object="${reviewForm}">
	<select th:field="*{rating}">
		<option value="1">★1</option>
		<option value="2">★2</option>
		<option value="3">★3</option>
		<option value="4">★4</option>
		<option value="5">★5</option>
	</select>

	<textarea th:field="*{comment}" placeholder="レビューを入力してください"></textarea>

	<button type="submit">投稿</button>
</form>
