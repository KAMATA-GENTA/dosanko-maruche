<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + '｜どさん娘マルシェ'">商品詳細｜どさん娘マルシェ</title>
    <link rel="stylesheet" href="/css/output.css">
    <style>
        .star-rating {
            position: relative;
            display: inline-block;
            font-size: 22px;
            line-height: 1;
            color: #ddd;
            letter-spacing: 2px;
        }
        .star-rating::before { content: "★★★★★"; }
        .star-rating::after {
            content: "★★★★★";
            position: absolute;
            left: 0;
            top: 0;
            width: var(--rating-percent);
            overflow: hidden;
            color: gold;
            white-space: nowrap;
        }
    </style>
</head>

<body class="bg-gray-900 hover:bg-black text-white"">

<header class="sticky top-0 z-50 border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-6 py-4 lg:flex-row lg:items-center lg:justify-between">
        <div class="text-2xl font-bold text-gray-800">
            <a href="/">どさん娘マルシェ</a>
        </div>

        <nav>
            <ul class="flex flex-wrap gap-4 text-sm font-medium text-gray-700">
                <li><a class="hover:text-orange-500" href="/">TOP</a></li>
                <li><a class="hover:text-orange-500" href="/region/1">札幌</a></li>
                <li><a class="hover:text-orange-500" href="/region/2">小樽</a></li>
                <li><a class="hover:text-orange-500" href="/region/3">函館</a></li>
                <li><a class="hover:text-orange-500" href="/region/4">北見</a></li>
                <li><a class="hover:text-orange-500" href="/region/5">帯広</a></li>
                <li><a class="hover:text-orange-500" href="/region/6">稚内</a></li>
                <li><a class="hover:text-orange-500" href="/history">購入履歴</a></li>
            </ul>
        </nav>

        <div class="flex gap-3 text-sm font-medium">
            <a class="rounded-lg bg-gray-100 px-4 py-2 hover:bg-gray-200" href="/login">ログイン</a>
            <a class="rounded-lg bg-gray-100 px-4 py-2 hover:bg-gray-200" href="/signup">新規登録</a>
            <a class="rounded-lg bg-orange-500 px-4 py-2 text-white hover:bg-orange-600" href="/cart">カート</a>
        </div>
    </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-10">

    <div class="mb-6 text-sm text-gray-500">
        <a class="hover:text-orange-500" href="/">ホーム</a>
        <span class="mx-2">/</span>
        <span th:text="${product.name}">商品名</span>
    </div>

    <section class="grid gap-8 rounded-2xl bg-white p-6 shadow-sm lg:grid-cols-2 lg:p-8">
        <div class="overflow-hidden rounded-2xl bg-gray-100">
            <img class="w-full object-cover" style="height: 420px;" th:src="${product.imageUrl}" th:alt="${product.name}">
        </div>

        <div class="flex flex-col justify-between gap-6">
            <div>
                <p class="mb-3 inline-block rounded-full bg-orange-100 px-4 py-1 text-sm font-semibold text-orange-600">北海道のおすすめ商品</p>
                <h1 class="text-3xl font-bold leading-tight text-gray-900" th:text="${product.name}">商品名</h1>

                <div class="mt-4 flex flex-wrap items-center gap-3">
                    <span class="star-rating" th:style="'--rating-percent:' + (${averageRating} * 20) + '%'"> </span>
                    <span class="rounded-full bg-gray-100 px-3 py-1 text-sm font-semibold text-gray-700" th:text="${averageRating} + ' / 5.0'">0.0 / 5.0</span>
                    <a class="text-sm font-semibold text-orange-500 hover:text-orange-600" href="#review-section">レビューを見る</a>
                </div>

                <p class="mt-6 text-4xl font-bold text-red-600" th:text="'¥' + ${product.price}">¥0</p>
                <p class="mt-2 text-sm text-gray-500">送料：800円</p>

                <p class="mt-6 leading-8 text-gray-700" th:text="${product.description}">
                    商品説明
                </p>
            </div>

            <form class="rounded-2xl border border-gray-200 bg-gray-50 p-5" th:action="@{/product/{id}/cart(id=${product.id})}" method="post">
                <label class="mb-2 block text-sm font-semibold text-gray-700" for="quantity">数量</label>
                <div class="flex flex-col gap-3 sm:flex-row">
                    <input id="quantity" class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-lg outline-none focus:border-orange-500 sm:w-32" type="number" name="quantity" value="1" min="1">
                    <button class="rounded-lg bg-orange-500 px-8 py-3 font-bold text-white hover:bg-orange-600" type="submit">カートに追加</button>
                </div>
            </form>
        </div>
    </section>

    <section id="review-section" class="mt-10 rounded-2xl bg-white p-6 shadow-sm lg:p-8">
        <div class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">レビュー</h2>
                <p class="mt-1 text-sm text-gray-500">評価順・星の数でレビューを絞り込めます。</p>
            </div>

            <form class="flex flex-wrap items-center gap-3" th:action="@{/product/{id}(id=${product.id})}" method="get">
                <label class="text-sm font-semibold text-gray-700" for="sort">並び順</label>
                <select class="rounded-lg border border-gray-300 bg-white px-3 py-2" id="sort" name="sort">
                    <option value="new" th:selected="${selectedSort == 'new'}">新しい順</option>
                    <option value="old" th:selected="${selectedSort == 'old'}">古い順</option>
                    <option value="high" th:selected="${selectedSort == 'high'}">評価が高い順</option>
                    <option value="low" th:selected="${selectedSort == 'low'}">評価が低い順</option>
                </select>

                <label class="text-sm font-semibold text-gray-700" for="rating">星の数</label>
                <select class="rounded-lg border border-gray-300 bg-white px-3 py-2" id="rating" name="rating">
                    <option value="" th:selected="${selectedRating == null}">すべて</option>
                    <option value="5" th:selected="${selectedRating == 5}">★5</option>
                    <option value="4" th:selected="${selectedRating == 4}">★4</option>
                    <option value="3" th:selected="${selectedRating == 3}">★3</option>
                    <option value="2" th:selected="${selectedRating == 2}">★2</option>
                    <option value="1" th:selected="${selectedRating == 1}">★1</option>
                </select>

                <button class="rounded-lg bg-gray-800 px-4 py-2 text-sm font-semibold text-white hover:bg-gray-700" type="submit">表示を変更</button>
                <a class="text-sm font-semibold text-gray-500 hover:text-orange-500" th:href="@{/product/{id}(id=${product.id})}">リセット</a>
            </form>
        </div>

        <div class="rounded-xl bg-gray-50 p-5 text-gray-500" th:if="${#lists.isEmpty(reviews)}">
            条件に合うレビューはありません。
        </div>

        <div class="space-y-4" th:if="${!#lists.isEmpty(reviews)}">
            <article class="rounded-xl border border-gray-200 p-5" th:each="review : ${reviews}">
                <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                    <p class="font-bold text-gray-800" th:text="${review.username != null ? review.username : 'ゲスト'}">投稿者</p>
                    <p class="text-sm text-gray-500" th:if="${review.createdAt != null}" th:text="${#temporals.format(review.createdAt, 'M月d日')}">投稿日</p>
                </div>

                <div class="mt-2 text-xl text-yellow-400">
                    <span th:each="i : ${#numbers.sequence(1,5)}" th:text="${i <= review.rating ? '★' : '☆'}"></span>
                </div>

                <p class="mt-3 leading-7 text-gray-700" th:text="${review.comment}">レビュー本文</p>
            </article>
        </div>
    </section>

    <section class="mt-10 rounded-2xl bg-white p-6 shadow-sm lg:p-8">
        <h2 class="text-2xl font-bold text-gray-900">レビュー投稿</h2>

        <form class="mt-5 grid gap-4" th:action="@{/product/{id}/review(id=${product.id})}" method="post" th:object="${reviewForm}">
            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">評価</label>
                <select class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 sm:w-48" th:field="*{rating}">
                    <option value="1">★1</option>
                    <option value="2">★2</option>
                    <option value="3">★3</option>
                    <option value="4">★4</option>
                    <option value="5">★5</option>
                </select>
            </div>

            <div>
                <label class="mb-2 block text-sm font-semibold text-gray-700">コメント</label>
                <textarea class="min-h-32 w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-orange-500" th:field="*{comment}" placeholder="レビューを入力してください"></textarea>
            </div>

            <button class="w-full rounded-lg bg-orange-500 px-6 py-3 font-bold text-white hover:bg-orange-600 sm:w-40" type="submit">投稿</button>
        </form>
    </section>

</main>

</body>
</html>
