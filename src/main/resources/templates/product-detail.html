<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_layout}">

<head>
	<meta charset="UTF-8">
	<title>商品詳細｜どさん娘マルシェ</title>

	<style>
        .star-rating {
            position: relative;
            display: inline-block;
            font-size: 20px;
            line-height: 1;
            color: #ddd;
			letter-spacing: 1px;
        }

        .star-rating::before {
            content: "★★★★★";
        }

        .star-rating::after {
            content: "★★★★★";
            position: absolute;
            left: 0;
            top: 0;
            width: var(--rating-percent);
            overflow: hidden;
            color: gold;
            white-space: nowrap;
        }
    </style>
</head>

<body>
<div layout:fragment="content">

    <!-- 商品名 -->
    <h1 th:text="${product.name}">商品名</h1>

    <!-- 商品画像 -->
    <img th:src="${product.imageUrl}" alt="商品画像">

    <!-- enumからProductServiceでセットされた地域名 -->
    <p>
        地域:
        <span th:text="${product.regionName}">地域名</span>
    </p>

    <!-- enumからProductServiceでセットされたカテゴリ名 -->
    <p>
        カテゴリ:
        <span th:text="${product.categoryName}">カテゴリ名</span>
    </p>

    <!-- 価格 -->
    <p>
        価格:
        <span th:text="${product.price}">0</span>円
    </p>

    <p>送料: 800円</p>

    <!-- 商品説明 -->
    <p th:text="${product.description}">商品説明</p>

    <!-- 平均星表示 -->
    <div style="display:flex; align-items:center; gap:10px;">

        <!-- averageRatingを星の幅に変換して表示 -->
        <span class="star-rating"
              th:style="'--rating-percent:' + (${averageRating} * 20) + '%'">
        </span>

        <span th:text="${averageRating}">0.0</span>

    </div>

    <a href="#review-section">レビューはこちら</a>

    <!-- カート追加 -->
    <form th:action="@{/products/{id}/cart(id=${product.id})}" method="post">
        <input type="number" name="quantity" value="1" min="1">
        <button type="submit">カートに追加</button>
    </form>

    <hr>

    <h2 id="review-section">レビュー</h2>

    <!-- レビューの並び替え・星の数フィルタ -->
    <form th:action="@{/products/{id}(id=${product.id})}" method="get">

        <label for="sort">並び順</label>
        <select id="sort" name="sort">
            <option value="new" th:selected="${selectedSort == 'new'}">新しい順</option>
            <option value="old" th:selected="${selectedSort == 'old'}">古い順</option>
            <option value="high" th:selected="${selectedSort == 'high'}">評価が高い順</option>
            <option value="low" th:selected="${selectedSort == 'low'}">評価が低い順</option>
        </select>

        <label for="rating">星の数</label>
        <select id="rating" name="rating">
            <option value="" th:selected="${selectedRating == null}">すべて</option>
            <option value="5" th:selected="${selectedRating == 5}">★5</option>
            <option value="4" th:selected="${selectedRating == 4}">★4</option>
            <option value="3" th:selected="${selectedRating == 3}">★3</option>
            <option value="2" th:selected="${selectedRating == 2}">★2</option>
            <option value="1" th:selected="${selectedRating == 1}">★1</option>
        </select>

        <button type="submit">表示を変更</button>

        <a th:href="@{/products/{id}(id=${product.id})}">
            条件をリセット
        </a>
    </form>

    <!-- レビューが0件の場合 -->
    <div th:if="${#lists.isEmpty(reviews)}">
        <p>条件に合うレビューはありません。</p>
    </div>

    <!-- レビュー一覧 -->
    <div th:each="review : ${reviews}">

        <p>
            投稿者：
            <span th:text="${review.username != null ? review.username : 'ゲスト'}">
                ゲスト
            </span>
        </p>

        <div>
            <span th:each="i : ${#numbers.sequence(1,5)}">
                <span th:text="${i <= review.rating ? '★' : '☆'}"></span>
            </span>
        </div>

        <p th:if="${review.createdAt != null}">
            投稿日：
            <span th:text="${#temporals.format(review.createdAt, 'M月d日')}">
                投稿日
            </span>
        </p>

        <p th:text="${review.comment}">レビューコメント</p>
    </div>

    <hr>

    <h3>レビュー投稿</h3>

    <!-- レビュー投稿 -->
    <form th:action="@{/products/{id}/review(id=${product.id})}"
          method="post"
          th:object="${reviewForm}">

        <select th:field="*{rating}">
            <option value="1">★1</option>
            <option value="2">★2</option>
            <option value="3">★3</option>
            <option value="4">★4</option>
            <option value="5">★5</option>
        </select>

        <textarea th:field="*{comment}"
                  placeholder="レビューを入力してください">
        </textarea>

        <button type="submit">投稿</button>
    </form>

</div>
</body>

</html>
