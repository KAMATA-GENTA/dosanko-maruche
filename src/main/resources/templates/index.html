<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/_layout}">

<head>
	<title>どさん娘マルシェ</title>
	<link rel="stylesheet" href="/css/home.css">
</head>

<body>
	<div layout:fragment="content">
		<!-- =========================
         洞窟背景 + 北海道マップ + キャラクター
    ========================== -->
		<section class="home-map-hero">
			<div class="home-map-overlay"></div>

			<div class="home-map-inner">
				<div class="home-map-text">
					<p class="home-map-badge">北海道のおいしさを、地域から探す</p>

					<div class="title-balloon-wrap">
						<h1>どさん娘マルシェ</h1>

						<div class="speech-balloon">
							<p>特産品を購入してキャラクターを進化させよう！</p>
						</div>

					</div>
					<p>
						キャラクターを選ぶと、札幌・小樽・函館・北見・帯広・稚内の地域詳細ページへ移動できます。
					</p>
				</div>

				<div class="hokkaido-map-wrap">
					<img class="hokkaido-map" src="/images/hokkaido-940x940.png" alt="北海道地図">

					<a href="/region/sapporo" class="map-character char-sapporo">
						<img src="/images/region-chara/sapporo/sapporonoel1.png" alt="札幌 ノエル">
						<span>札幌</span>
					</a>

					<a href="/region/otaru" class="map-character char-otaru">
						<img src="/images/region-chara/otaru/otarun1.png" alt="小樽 おたるん">
						<span>小樽</span>
					</a>

					<a href="/region/hakodate" class="map-character char-hakodate">
						<img src="/images/region-chara/hakodate/hakodateakari1.png" alt="函館 アカリ">
						<span>函館</span>
					</a>

					<a href="/region/kitami" class="map-character char-kitami">
						<img src="/images/region-chara/kitami/kitamin1.png" alt="北見 きたみん">
						<span>北見</span>
					</a>

					<a href="/region/obihiro" class="map-character char-obihiro">
						<img src="/images/region-chara/obihiro/obihironeyu1.png" alt="帯広 ネユ">
						<span>帯広</span>
					</a>

					<a href="/region/wakkanai" class="map-character char-wakkanai">
						<img src="/images/region-chara/wakkanai/wakkanaisiori1.png" alt="稚内 しおり">
						<span>稚内</span>
					</a>
				</div>
			</div>
		</section>
		<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
			<!-- ランキング -->
			<div layout:replace="~{fragments/_ranking::ranking}"></div>

			<!-- =========================
         カテゴリ絞り込み
    ========================== -->
			<section class="home-section filter-section">

				<div class="section-heading">
					<h2 class="text-lg font-bold">商品をカテゴリで探す</h2>
				</div>

				<div class="flex flex-wrap gap-2 mt-4">

					<!-- すべて -->
					<a href="/#product-section" class="btn btn-sm"
						th:classappend="${selectedCategoryId == null} ? ' btn-primary' : ' btn-outline'">
						すべて
					</a>

					<!-- カテゴリ -->
					<a th:each="category : ${categories}" th:href="@{/(categoryId=${category.id})} + '#product-section'"
						class="btn btn-sm"
						th:classappend="${selectedCategoryId == category.id} ? ' btn-primary' : ' btn-outline'"
						th:text="${category.name}">
					</a>

				</div>

			</section>

			<div layout:replace="~{fragments/_item-card::item-card}"></div>
		</main>




	</div>
</body>

</html>
