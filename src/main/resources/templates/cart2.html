<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/_layout}">

<head></head>

<body>
  <div layout:fragment="content">
    <div class="cart-container">

      <h1>カート</h1>

      <table>
        <tr>
          <th>商品名</th>
          <th>価格</th>
          <th>数量</th>
          <th>小計</th>
        </tr>

        <tr th:each="item : ${cartItems}">
          <td th:text="${item.productName}">商品名</td>
          <td th:text="${item.price} + '円'">0円</td>
          <td th:text="${item.quantity}">1</td>
          <td th:text="${item.subtotal} + '円'">0円</td>
        </tr>
      </table>

	  <tr th:each="item : ${cartItems}">
	      <td th:text="${item.product.name}">商品名</td>

	      <td th:text="${item.product.price} + '円'">
	          0円
	      </td>

	      <td th:text="${item.cartItem.quantity}">
	          1
	      </td>

	      <td th:text="${item.subtotal} + '円'">
	          0円
	      </td>
	  </tr>
    </table>

    </div>
  </div>
</body>

</html>
