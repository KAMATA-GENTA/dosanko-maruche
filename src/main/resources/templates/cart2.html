<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/_layout}">

<head>
	<title>カート｜どさん娘マルシェ</title>
</head>

<body>
	<div layout:fragment="content">

		<main class="mx-auto w-full max-w-6xl px-4 py-8">

			<div class="mb-6">
				<p class="text-sm font-semibold text-primary">Shopping Cart</p>
				<h1 class="text-3xl font-bold text-base-content">ショッピングカート</h1>
			</div>

			<div th:if="${#lists.isEmpty(cartItems)}"
				class="rounded-2xl border border-base-300 bg-base-100 p-10 text-center shadow-sm">

				<p class="text-lg font-bold text-base-content">カートは空です</p>
				<p class="mt-2 text-sm text-base-content/60">
					気になる北海道の商品を探してみましょう。
				</p>

				<a href="/" class="btn btn-primary mt-6 rounded-full px-8">
					商品を見に行く
				</a>
			</div>

			<div th:if="${!#lists.isEmpty(cartItems)}" class="grid gap-6 lg:grid-cols-[1fr_340px]">

				<section class="space-y-4">

					<div class="rounded-2xl border border-base-300 bg-base-100 p-5 shadow-sm">
						<div class="flex items-center justify-between border-b border-base-300 pb-4">
							<h2 class="text-xl font-bold text-base-content">
								カート内の商品
							</h2>
							<p class="text-sm text-base-content/60">
								数量の変更ができます
							</p>
						</div>

						<div class="divide-y divide-base-300">

							<div th:each="item : ${cartItems}"
								class="flex flex-col gap-4 py-5 md:flex-row md:items-center md:justify-between">

								<div class="flex flex-1 items-center gap-4">
									<div
										class="flex h-24 w-24 shrink-0 items-center justify-center rounded-xl bg-base-200 p-2">
										<img th:src="${item.imageUrl}" th:alt="${item.productName}"
											class="h-full w-full object-contain">
									</div>

									<div>
										<h3 class="text-lg font-bold text-base-content" th:text="${item.productName}">
											商品名
										</h3>

										<p class="mt-1 text-sm text-base-content/60">
											北海道こだわりの商品
										</p>

										<p class="mt-2 font-bold text-primary" th:text="${item.price} + '円'">
											0円
										</p>
									</div>
								</div>

								<div class="flex items-center justify-between gap-5 md:justify-end">

									<div class="join">
										<form th:action="@{/cart/change}" method="post">
											<input type="hidden" name="cartId" th:value="${item.cartId}">
											<input type="hidden" name="quantity" th:value="${item.quantity - 1}">
											<button type="submit" class="btn join-item btn-sm">
												−
											</button>
										</form>

										<div class="join-item flex min-w-12 items-center justify-center border-y border-base-300 px-4 text-sm font-bold"
											th:text="${item.quantity}">
											1
										</div>

										<form th:action="@{/cart/change}" method="post">
											<input type="hidden" name="cartId" th:value="${item.cartId}">
											<input type="hidden" name="quantity" th:value="${item.quantity + 1}">
											<button type="submit" class="btn join-item btn-sm">
												＋
											</button>
										</form>
									</div>

									<div class="min-w-24 text-right">
										<p class="text-xs text-base-content/50">小計</p>
										<p class="text-lg font-bold text-base-content" th:text="${item.subtotal} + '円'">
											0円
										</p>
									</div>

								</div>

							</div>

						</div>
					</div>

				</section>

				<aside class="h-fit rounded-2xl border border-base-300 bg-base-100 p-6 shadow-sm lg:sticky lg:top-6">

					<h2 class="border-b border-base-300 pb-4 text-xl font-bold text-base-content">
						注文内容
					</h2>

					<div class="space-y-3 py-5 text-sm">
						<div class="flex justify-between">
							<span class="text-base-content/70">商品合計</span>
							<span class="font-bold" th:text="${subtotal} + '円'">0円</span>
						</div>

						<div class="flex justify-between">
							<span class="text-base-content/70">送料</span>
							<span class="font-bold" th:text="${shippingFee} + '円'">0円</span>
						</div>
					</div>

					<div class="flex justify-between border-t border-base-300 pt-5">
						<span class="text-lg font-bold">合計</span>
						<span class="text-2xl font-black text-primary" th:text="${totalPrice} + '円'">
							0円
						</span>
					</div>

					<a th:href="@{/treasure}" class="btn btn-primary mt-6 w-full rounded-full text-base font-bold">
						購入へ進む
					</a>

					<a href="/" class="btn btn-outline btn-primary mt-3 w-full rounded-full">
						買い物を続ける
					</a>

				</aside>

			</div>

		</main>

	</div>
</body>

</html>
