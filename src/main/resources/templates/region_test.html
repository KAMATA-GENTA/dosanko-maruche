<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/_layout}">

<head>

	<style>
		:root {
			--sky-main: #2f7dd3;
			--sky-dark: #1e5fa8;
			--sky-border: #d7eaff;
			--text-sub: #526173;
		}


		/* ===================
全体
=================== */

		.region-page {

			max-width:
				1200px;

			margin:
				0 auto;

			padding:
				32px 20px 64px;
		}



		/* ===================
地域紹介
=================== */

		.region-hero {

			background:
				white;

			border:
				1px solid var(--sky-border);

			border-radius:
				20px;

			overflow:
				hidden;

			box-shadow:
				0 14px 32px rgba(43,
					107,
					173,
					.08);
		}



		.region-image {

			width:
				100%;

			height:
				280px;

			object-fit:
				cover;
		}



		.region-info {

			display:
				grid;

			grid-template-columns:
				1fr 220px;

			gap:
				24px;

			padding:
				28px;
		}



		.region-title {

			font-size:
				34px;

			font-weight:
				900;
		}



		.region-description {

			color:
				var(--text-sub);

			line-height:
				1.9;
		}



		.character-image {

			width:
				180px;
		}



		/* ===================
ランキング
=================== */

		.ranking-section {

			margin-top:
				42px;
		}


		.section-title {

			margin:
				0 0 22px;

			font-size:
				28px;

			font-weight:
				900;

			color:
				var(--sky-main);
		}



		.ranking-area {

			display:
				grid;

			gap:
				24px;
		}



		.ranking-block {

			background:
				white;

			border:
				1px solid var(--sky-border);

			border-radius:
				20px;

			padding:
				24px;
		}



		.card-list {

			display:
				grid;

			grid-template-columns:
				repeat(3,
					1fr);

			gap:
				20px;
		}



		/* ランキング専用 */

		.ranking-section .product-card {

			background:
				white;

			border:
				1px solid var(--sky-border);

			border-radius:
				18px;

			overflow:
				hidden;

			padding:
				0;
		}



		.rank-badge {

			display:
				inline-flex;

			margin:
				14px;

			padding:
				7px 12px;

			border-radius:
				999px;

			background:
				linear-gradient(135deg,
					#3587e5,
					#1f6fc7);

			color:
				white;
		}



		.ranking-section .product-card img {

			height:
				180px;

			width:
				100%;

			object-fit:
				cover;
		}



		/* ===================
カテゴリ
=================== */


		.category-section {

			margin-top:
				42px;
		}



		.category-list {

			display:
				flex;

			gap:
				12px;

			flex-wrap:
				wrap;
		}



		.category-card {

			padding:
				12px 22px;

			border:
				1px solid var(--sky-border);

			border-radius:
				999px;

			background:
				white;

			color:
				var(--sky-main);

			text-decoration:
				none;
		}



		.category-card.active,
		.category-card:hover {

			background:
				linear-gradient(135deg,
					#3587e5,
					#1f6fc7);

			color:
				white;
		}



		/* =========================
		   商品一覧を home.html と完全統一
		========================= */

		.regionProduct-section .product-list {
			display: flex !important;
			flex-wrap: wrap !important;
			gap: 20px !important;
		}

		.regionProduct-section .product-card {
			width: 250px !important;
			min-width: 0 !important;
			height: auto !important;

			background-color: white !important;
			border: none !important;
			border-radius: 10px !important;

			padding: 15px !important;
			box-shadow: 0 4px 16px rgba(0, 0, 0, .04) !important;
			overflow: visible !important;
		}

		.regionProduct-section .product-card:hover {
			transform: translateY(-2px) !important;
		}

		.regionProduct-section .product-card img {
			width: 100% !important;
			height: 180px !important;

			object-fit: cover !important;
			border-radius: 10px !important;

			padding: 0 !important;
			background: transparent !important;
		}

		.regionProduct-section .product-card h3 {
			margin-top: 10px !important;
			margin-bottom: 10px !important;
			padding: 0 !important;

			font-size: 20px !important;
			font-weight: 700 !important;
			color: #d6005c !important;
			line-height: 1.5 !important;
		}

		.regionProduct-section .price {
			margin: 0 !important;
			padding: 0 !important;

			color: #d6005c !important;
			font-size: 22px !important;
			font-weight: 800 !important;
		}

		.regionProduct-section .product-card a {
			display: inline-block !important;

			margin-top: 10px !important;
			margin-left: 0 !important;
			margin-right: 0 !important;
			margin-bottom: 0 !important;

			padding: 0 !important;

			background: transparent !important;
			box-shadow: none !important;
			border-radius: 0 !important;

			color: #d6005c !important;
			font-size: 18px !important;
			font-weight: 700 !important;
			text-decoration: none !important;
		}


		/* ===================
レスポンシブ
=================== */

		@media(max-width: 900px) {

			.region-info {

				grid-template-columns:
					1fr;
			}

			.card-list {

				grid-template-columns:
					1fr;
			}

		}
	</style>

</head>



<body>

	<div layout:fragment="content">

		<main class="region-page">


			<section class="region-hero">

				<img class="region-image" th:src="@{'/images/' + ${region.regionImage}}">


				<div class="region-info">

					<div>

						<h1 class="region-title" th:text="${region.name}">
						</h1>


						<p class="region-description" th:text="${region.description}">
						</p>

					</div>


					<img class="character-image" th:src="@{'/images/Character/' + ${region.character.childImageUrl}}">

				</div>

			</section>




			<section class="category-section">

				<h2 class="section-title">

					カテゴリから探す

				</h2>


				<div class="category-list">

					<a class="category-card" th:href="@{/region/{regionName}(regionName=${regionName})}">

						すべて

					</a>

				</div>

			</section>



			<section class="regionProduct-section" id="regionProduct-section">

				<h2 class="section-title">

					商品一覧

				</h2>


				<div class="product-list">

					<div class="product-card" th:each="
			product :
			${products}
			">

						<img th:src="${product.imageUrl}" alt="商品画像">


						<h3 th:text="${product.name}">
						</h3>



						<p class="price" th:text="'¥'+${product.price}">
						</p>



						<a th:href="@{/products/{id}(id=${product.id})}">

							詳細を見る

						</a>

					</div>

				</div>

			</section>


		</main>

	</div>

</body>

</html>
