<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>地域詳細</title>
</head>
<style>
body {
	margin: 0;
	background-color: #f4f4f4;
	font-family: sans-serif;
	color: #333;
}

.region-image {
	width: 100%;
	height: auto;
}

.character-image {
	width: 500px;
}

.ranking-section,
.category-section {
	padding: 20px 14px;
}

.ranking-title,
.category-title {
	font-size: 36px;
	font-weight: bold;
	margin-bottom: 50px;
}

.ranking-area {
	display: flex;
	gap: 90px;
	overflow-x: auto;
	padding-bottom: 18px;
}

.ranking-block {
	min-width: 1200px;
}

.ranking-block h2 {
	font-size: 26px;
	margin-bottom: 28px;
}

.card-list {
	display: flex;
	gap: 30px;
}

.product-card {
	min-width: 330px;
	height: 450px;
	background-color: #fff;
	border-radius: 12px;
	padding: 22px;
}

.rank-badge {
	display: inline-block;
	background-color: orange;
	color: white;
	font-size: 22px;
	font-weight: bold;
	padding: 10px 16px;
	border-radius: 6px;
	margin-bottom: 15px;
}

.product-image {
	width: 100%;
	height: 240px;
	object-fit: cover;
}

.product-name {
	font-size: 22px;
	font-weight: bold;
	margin-top: 16px;
}

.product-area {
	font-size: 20px;
	margin-top: 6px;
}

.product-price {
	color: crimson;
	font-size: 22px;
	font-weight: bold;
	margin-top: 18px;
}

.category-buttons {
	display: flex;
	gap: 26px;
	flex-wrap: wrap;
}

.category-buttons a {
	background-color: #4aa3f5;
	color: white;
	text-decoration: none;
	font-size: 20px;
	font-weight: bold;
	padding: 20px 38px;
	border-radius: 8px;
}
</style>

</head>
<body>

<h1 th:text="${region.name}">地域名</h1>

<img th:src="@{'/images/' + ${region.regionImage}}" alt="地域画像" width="100%">

<p th:text="${region.description}">
    地域説明
</p>
<img th:src="@{'/images/Character/' + ${region.charaImage.charaImage}}" alt="キャラクター画像" width="500">
<section class="ranking-section">

	<h1 class="ranking-title">カテゴリ別ランキング</h1>

	<div class="ranking-area">

		<div class="ranking-block">
			<h2>海産物ランキング</h2>

			<div class="card-list">
				<div class="product-card">
					<div class="rank-badge">1位</div>
					<img src="/images/products/kaisen.jpg" alt="商品画像" class="product-image">
					<div class="product-name">海鮮丼セット</div>
					<div class="product-area">函館</div>
					<div class="product-price">¥3,500</div>
				</div>

				<div class="product-card">
					<div class="rank-badge">2位</div>
					<img src="/images/products/hotate.jpg" alt="商品画像" class="product-image">
					<div class="product-name">ホタテセット</div>
					<div class="product-area">稚内</div>
					<div class="product-price">¥2,800</div>
				</div>

				<div class="product-card">
					<div class="rank-badge">3位</div>
					<img src="/images/products/kani.jpg" alt="商品画像" class="product-image">
					<div class="product-name">カニ詰め合わせ</div>
					<div class="product-area">小樽</div>
					<div class="product-price">¥5,000</div>
				</div>
			</div>
		</div>

		<div class="ranking-block">
			<h2>畜産物ランキング</h2>

			<div class="card-list">
				<div class="product-card">
					<div class="rank-badge">1位</div>
					<img src="/images/products/jingisukan.jpg" alt="商品画像" class="product-image">
					<div class="product-name">ジンギスカン</div>
					<div class="product-area">帯広</div>
					<div class="product-price">¥2,980</div>
				</div>
			</div>
		</div>

	</div>

</section>


<!-- 追加：カテゴリから探す -->
<section class="category-section">

	<h1 class="category-title">🛒 カテゴリから探す</h1>

	<div class="category-buttons">
		<a href="/products">すべて</a>
		<a href="/products?category=seafood">海産物</a>
		<a href="/products?category=meat">畜産物</a>
		<a href="/products?category=farm">農産物</a>
		<a href="/products?category=souvenir">お土産</a>
	</div>

</section>

</body>
</html>
