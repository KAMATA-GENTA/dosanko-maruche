<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/_layout}">

<head>
    <link rel="stylesheet" href="/css/regions.css">
</head>




<body th:style="'background-color:' + ${region.backgroundColor}">
    <div layout:fragment="content">


        <h1 th:text="${region.name}">地域名</h1>
        <img th:src="@{'/images/' + ${region.regionImage}}" alt="地域画像" class="region-image">

        <p th:text="${region.description}"></p>


        <img th:src="@{'/images/Character/' + ${characterImage}}" alt="キャラクター画像" width="300">
        <section class="ranking-section">


            <p th:text="${region.description}">
                地域説明
            </p>
            <img th:src="@{'/images/Character/' + ${region.character.childImageUrl}}" alt="キャラクター画像" width="500">
            <section class="ranking-section">

                <h1 class="ranking-title">カテゴリ別ランキング</h1>

                <div class="ranking-area">

                    <div class="ranking-block">
                        <h2>海産物ランキング</h2>

                        <div class="card-list">
                            <div class="product-card">
                                <div class="rank-badge">1位</div>
                                <img src="/images/products/kaisen.jpg" alt="商品画像" class="product-image">
                                <div class="product-name">海鮮丼セット</div>
                                <div class="product-area">函館</div>
                                <div class="product-price">¥3,500</div>
                            </div>

                            <div class="product-card">
                                <div class="rank-badge">2位</div>
                                <img src="/images/products/hotate.jpg" alt="商品画像" class="product-image">
                                <div class="product-name">ホタテセット</div>
                                <div class="product-area">稚内</div>
                                <div class="product-price">¥2,800</div>
                            </div>

                            <div class="product-card">
                                <div class="rank-badge">3位</div>
                                <img src="/images/products/kani.jpg" alt="商品画像" class="product-image">
                                <div class="product-name">カニ詰め合わせ</div>
                                <div class="product-area">小樽</div>
                                <div class="product-price">¥5,000</div>
                            </div>
                        </div>
                    </div>

                    <div class="ranking-block">
                        <h2>畜産物ランキング</h2>

                        <div class="card-list">
                            <div class="product-card">
                                <div class="rank-badge">1位</div>
                                <img src="/images/products/jingisukan.jpg" alt="商品画像" class="product-image">
                                <div class="product-name">ジンギスカン</div>
                                <div class="product-area">帯広</div>
                                <div class="product-price">¥2,980</div>
                            </div>
                        </div>
                    </div>

                </div>

            </section>



            <!-- 商品カテゴリ -->
            <section class="category-section">
                <h2>カテゴリから探す</h2>

                <div class="category-list">

                    <a th:href="@{/region/{regionName}(regionName=${regionName})} + '#regionProduct-section'"
                        class="category-card">
                        すべて
                    </a>

                    <a th:href="@{/region/{regionName}/category/{categoryId}(regionName=${regionName}, categoryId=1)} + '#regionProduct-section'"
                        class="category-card" th:classappend="${selectedCategoryId == 1} ? ' active'">
                        海産物
                    </a>

                    <a th:href="@{/region/{regionName}/category/{categoryId}(regionName=${regionName}, categoryId=3)} + '#regionProduct-section'"
                        class="category-card" th:classappend="${selectedCategoryId == 3} ? ' active'">
                        畜産物
                    </a>

                    <a th:href="@{/region/{regionName}/category/{categoryId}(regionName=${regionName}, categoryId=2)} + '#regionProduct-section'"
                        class="category-card" th:classappend="${selectedCategoryId == 2} ? ' active'">
                        農産物
                    </a>

                    <a th:href="@{/region/{regionName}/category/{categoryId}(regionName=${regionName}, categoryId=4)} + '#regionProduct-section'"
                        class="category-card" th:classappend="${selectedCategoryId == 4} ? ' active'">
                        お土産
                    </a>
                </div>
            </section>


            <!-- 商品一覧 -->
            <section class="regionProduct-section" id="regionProduct-section">
                <h2>商品一覧</h2>

                <div class="product-list">

                    <div class="product-card" th:each="product : ${products}">

                        <img th:src="${product.imageUrl}" alt="商品画像">

                        <h3 th:text="${product.name}">
                            商品名
                        </h3>

                        <p th:text="'地域ID：' + ${product.regionId}">
                            地域
                        </p>

                        <p class="price" th:text="'¥' + ${product.price}">
                            ¥0
                        </p>

                        <a th:href="@{/products/{id}(id=${product.id})}">
                            詳細を見る
                        </a>

                    </div>

                </div>
            </section>

        </section>
    </div>
</body th:style="'background-color:' + ${region.backgroundColor}">

</html>
