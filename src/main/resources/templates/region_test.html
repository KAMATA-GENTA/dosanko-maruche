<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_layout}">

<head>
    <meta charset="UTF-8">
    <title>地域詳細</title>
</head>

<body>
<div layout:fragment="content">

    <!-- Region enumから取得した地域名を表示 -->
    <h1 th:text="${region.name}">地域名</h1>

    <!-- Region enumのregionImageを使って地域画像を表示 -->
    <img th:src="@{'/images/' + ${region.regionImage}}"
         alt="地域画像"
         width="100%">

    <!-- Region enumのdescriptionを表示 -->
    <p th:text="${region.description}">
        地域説明
    </p>

    <!-- Region enumに紐づくCharacterの画像を表示 -->
    <img th:src="@{'/images/Character/' + ${region.character.childImageUrl}}"
         alt="キャラクター画像"
         width="500">

    <!-- 商品カテゴリ -->
    <section class="category-section">
        <h2>カテゴリから探す</h2>

        <div class="category-list">

            <!-- カテゴリ未選択の場合、その地域の全商品を表示 -->
            <a th:href="@{/region/{regionId}(regionId=${regionId})}"
               class="category-card"
               th:classappend="${selectedCategoryId == null} ? ' active'">
                すべて
            </a>

            <!-- Category enumからカテゴリリンクを作成 -->
            <a th:each="category : ${categories}"
               th:href="@{/region/{regionId}(regionId=${regionId}, categoryId=${category.id})}"
               class="category-card"
               th:classappend="${selectedCategoryId == category.id} ? ' active'"
               th:text="${category.name}">
                カテゴリ名
            </a>

        </div>
    </section>

    <!-- 商品一覧 -->
    <section class="regionProduct-section" id="regionProduct-section">
        <h2>商品一覧</h2>

        <div class="product-list">

            <!-- RegionControllerから渡されたproductsを1件ずつ表示 -->
            <div class="product-card"
                 th:each="product : ${products}">

                <!-- 商品画像 -->
                <img th:src="${product.imageUrl}" alt="商品画像">

                <!-- 商品名 -->
                <h3 th:text="${product.name}">
                    商品名
                </h3>

                <!-- ProductServiceでRegion enumからセットした地域名 -->
                <p th:text="${product.regionName}">
                    地域名
                </p>

                <!-- ProductServiceでCategory enumからセットしたカテゴリ名 -->
                <p th:text="${product.categoryName}">
                    カテゴリ名
                </p>

                <!-- 価格 -->
                <p class="price"
                   th:text="'¥' + ${product.price}">
                    ¥0
                </p>

                <!-- 商品詳細ページへのリンク -->
                <a th:href="@{/products/{id}(id=${product.id})}">
                    詳細を見る
                </a>

            </div>

        </div>
    </section>

</div>
</body>

</html>
