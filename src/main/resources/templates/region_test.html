<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/_layout}">

<head>
	<meta charset="UTF-8">
	<title>地域詳細</title>
	<link rel="stylesheet" href="/css/regions.css">
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body th:style="'background-color:' + ${region.backgroundColor}">

	<div layout:fragment="content">

		<div class="region-visual" x-data="{ open: false }">

			<img th:src="@{'/images/' + ${region.regionImage}}" alt="地域画像" class="region-image">

			<div class="description-bubble" x-show="open" x-transition x-cloak>
				<p id="regionDescription" th:text="${region.description}">
					地域説明
				</p>
				<span class="speech-tail"></span>
			</div>

			<img th:src="@{'/images/Character/' + ${characterImage}}" alt="キャラクター画像" class="character-image"
				@click="open = !open">

		</div>


		<section class="home-section">
			<div class="section-heading">
				<p>Ranking</p>
				<h2>カテゴリ別ランキング</h2>
			</div>

			<div class="ranking-carousel">

				<div class="ranking-category">
					<h3>海産物ランキング</h3>

					<div class="ranking-list">
						<div class="ranking-card" th:each="product, stat : ${seafoodRanking}">
							<span class="rank" th:text="${stat.index + 1} + '位'">1位</span>
							<img th:src="${product.imageUrl}" alt="商品画像">
							<h4 th:text="${product.productName}">商品名</h4>
							<p th:text="${product.regionName}">地域名</p>
							<p class="price" th:text="'¥' + ${product.price}">¥0</p>
							<a th:href="@{/products/{id}(id=${product.id})}">詳細を見る</a>
						</div>
					</div>
				</div>

				<div class="ranking-category">
					<h3>畜産物ランキング</h3>

					<div class="ranking-list">
						<div class="ranking-card" th:each="product, stat : ${meatRanking}">
							<span class="rank" th:text="${stat.index + 1} + '位'">1位</span>
							<img th:src="${product.imageUrl}" alt="商品画像">
							<h4 th:text="${product.productName}">商品名</h4>
							<p th:text="${product.regionName}">地域名</p>
							<p class="price" th:text="'¥' + ${product.price}">¥0</p>
							<a th:href="@{/products/{id}(id=${product.id})}">詳細を見る</a>
						</div>
					</div>
				</div>

				<div class="ranking-category">
					<h3>農産物ランキング</h3>

					<div class="ranking-list">
						<div class="ranking-card" th:each="product, stat : ${vegetableRanking}">
							<span class="rank" th:text="${stat.index + 1} + '位'">1位</span>
							<img th:src="${product.imageUrl}" alt="商品画像">
							<h4 th:text="${product.productName}">商品名</h4>
							<p th:text="${product.regionName}">地域名</p>
							<p class="price" th:text="'¥' + ${product.price}">¥0</p>
							<a th:href="@{/products/{id}(id=${product.id})}">詳細を見る</a>
						</div>
					</div>
				</div>

				<div class="ranking-category">
					<h3>お土産ランキング</h3>

					<div class="ranking-list">
						<div class="ranking-card" th:each="product, stat : ${souvenirRanking}">
							<span class="rank" th:text="${stat.index + 1} + '位'">1位</span>
							<img th:src="${product.imageUrl}" alt="商品画像">
							<h4 th:text="${product.productName}">商品名</h4>
							<p th:text="${product.regionName}">地域名</p>
							<p class="price" th:text="'¥' + ${product.price}">¥0</p>
							<a th:href="@{/products/{id}(id=${product.id})}">詳細を見る</a>
						</div>
					</div>
				</div>

			</div>
		</section>


		<section class="home-section filter-section">
			<div class="section-heading">
				<p>Category</p>
				<h2>商品をカテゴリで探す</h2>
			</div>

			<div class="category-list">

				<a th:href="@{/region/{regionName}(regionName=${region.urlName})} + '#regionProduct-section'"
					class="category-card" th:classappend="${selectedCategoryId == null} ? ' active'">
					すべて
				</a>

				<a th:each="category : ${categories}"
					th:href="@{/region/{regionName}(regionName=${region.urlName}, categoryId=${category.id})} + '#regionProduct-section'"
					class="category-card" th:classappend="${selectedCategoryId == category.id} ? ' active'"
					th:text="${category.name}">
					カテゴリ名
				</a>

			</div>
		</section>


		<section id="regionProduct-section" class="home-section">
			<div class="section-heading">
				<p>Products</p>
				<h2>商品一覧</h2>
			</div>

			<div class="product-list">

				<div class="product-card" th:each="product : ${products}">
					<img th:src="${product.imageUrl}" alt="商品画像">

					<h3 th:text="${product.name}">
						商品名
					</h3>

					<p th:text="${T(com.example.demo.enums.Region).getNameById(product.regionId)}">
						地域名
					</p>

					<p th:text="${T(com.example.demo.enums.Category).getNameById(product.categoryId)}">
						カテゴリ名
					</p>

					<p class="price" th:text="'¥' + ${product.price}">
						¥0
					</p>

					<a th:href="@{/products/{id}(id=${product.id})}">
						詳細を見る
					</a>
				</div>

			</div>
		</section>

	</div>

</body>

</html>
