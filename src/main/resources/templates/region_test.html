<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/_layout}" th:attr="data-theme=${region.character.theme.name}">

<head>
    <meta charset="UTF-8">
    <title>地域詳細</title>
    <link rel="stylesheet" href="/css/regions.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>

<body>

    <div layout:fragment="content">


        <div class="region-visual relative inline-block" x-data="{ open: false }">

            <img th:src="@{'/images/' + ${region.regionImage}}" alt="地域画像" class="region-image">

            <div class="description-bubble" x-show="open" x-transition x-cloak>
                <p id="regionDescription" th:text="${region.description}">
                    地域説明
                </p>
                <span class="speech-tail"></span>
            </div>

            <img th:src="@{'/images/Character/' + ${characterImage}}" alt="キャラクター画像" class="character-image"
                @click="open = !open">

        </div>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div layout:replace="~{fragments/_ranking::ranking}"></div>


            <section class="home-section filter-section">

                <div class="section-heading">
                    <p>Category</p>
                    <h2 class="text-lg font-bold">商品をカテゴリで探す</h2>
                </div>

                <div class="flex flex-wrap gap-2 mt-4">

                    <!-- すべて -->
                    <a th:href="@{/region/{regionName}(regionName=${region.urlName})} + '#regionProduct-section'"
                        class="btn btn-sm"
                        th:classappend="${selectedCategoryId == null} ? ' btn-primary' : ' btn-outline'">
                        すべて
                    </a>

                    <!-- カテゴリ -->
                    <a th:each="category : ${categories}"
                        th:href="@{/region/{regionName}(regionName=${region.urlName}, categoryId=${category.id})} + '#regionProduct-section'"
                        class="btn btn-sm"
                        th:classappend="${selectedCategoryId == category.id} ? ' btn-primary' : ' btn-outline'"
                        th:text="${category.name}">
                    </a>

                </div>

            </section>

            <div layout:replace="~{fragments/_item-card::item-card}"></div>

        </main>
    </div>

</body>

</html>
