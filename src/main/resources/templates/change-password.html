<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/_layout}">

<head></head>

<body>
  <div layout:fragment="content">
    <!-- Burger menu  -->
    <section x-show="mobileMenuOpen" @click.outside="mobileMenuOpen = false"
      class="absolute left-0 right-0 z-50 h-screen w-full bg-white" style="display: none">
      <div class="mx-auto">
        <div class="mx-auto flex w-full justify-center gap-3 py-4">
          <a href="wishlist" class="flex cursor-pointer flex-col items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
            </svg>

            <p class="text-xs">Wishlist</p>
          </a>

          <a href="cart" class="flex cursor-pointer flex-col items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6">
              <path fill-rule="evenodd"
                d="M7.5 6v.75H5.513c-.96 0-1.764.724-1.865 1.679l-1.263 12A1.875 1.875 0 004.25 22.5h15.5a1.875 1.875 0 001.865-2.071l-1.263-12a1.875 1.875 0 00-1.865-1.679H16.5V6a4.5 4.5 0 10-9 0zM12 3a3 3 0 00-3 3v.75h6V6a3 3 0 00-3-3zm-3 8.25a3 3 0 106 0v-.75a.75.75 0 011.5 0v.75a4.5 4.5 0 11-9 0v-.75a.75.75 0 011.5 0v.75z"
                clip-rule="evenodd" />
            </svg>

            <p class="text-xs">Cart</p>
          </a>

          <a href="account-page" class="relative flex cursor-pointer flex-col items-center justify-center">
            <span class="absolute bottom-[33px] right-1 flex h-2 w-2">
              <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex h-2 w-2 rounded-full bg-red-500"></span>
            </span>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>

            <p class="text-xs">Account</p>
          </a>

          <form class="my-4 mx-5 flex h-9 items-center border">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="mx-3 h-4 w-4">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
            </svg>

            <input class="hidden w-11/12 outline-none md:block" type="search" placeholder="Search" />

            <button type="submit" class="ml-auto h-full bg-neutral px-4 hover:bg-yellow-300">
              Search
            </button>
          </form>
          <ul class="text-center font-medium">
            <li class="py-2"><a href="/index">Home</a></li>
            <li class="py-2"><a href="catalog">Catalog</a></li>
            <li class="py-2"><a href="about-us">About Us</a></li>
            <li class="py-2"><a href="contact-us">Contact Us</a></li>
          </ul>
        </div>
    </section>
    <!-- /Burger menu  -->    <!-- breadcrumbs  -->

    <nav class="mx-auto w-full mt-4 max-w-[1200px] px-5">
      <ul class="flex items-center">
        <li class="cursor-pointer">
          <a href="/index">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
              <path
                d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
              <path
                d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
            </svg>
          </a>
        </li>
        <li>
          <span class="mx-2 text-gray-500">&gt;</span>
        </li>

        <li class="text-gray-500">Change Password</li>
      </ul>
    </nav>
    <!-- /breadcrumbs  -->

    <section class="container mx-auto flex-grow max-w-[1200px] border-b py-5 lg:flex lg:flex-row lg:py-10">
      <!-- sidebar  -->
      <section class="hidden w-[300px] flex-shrink-0 px-4 lg:block">
        <div class="border-b py-5">
          <div class="flex items-center">
            <img width="40px" height="40px" class="rounded-full object-cover" src="./images/avatar-photo.png"
              alt="Red woman portrait" />
            <div class="ml-5">
              <p class="font-medium text-gray-500">Hello,</p>
              <p class="font-bold">Sarah Johnson</p>
            </div>
          </div>
        </div>

        <div class="flex border-b py-5">
          <div class="w-full">
            <div class="flex w-full">
              <div class="flex flex-col gap-2">
                <a href="account-page" class="flex items-center gap-2 font-medium">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="h-5 w-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875 1.875 0 11-3.75 0 1.875 1.875 0 013.75 0zm1.294 6.336a6.721 6.721 0 01-3.17.789 6.721 6.721 0 01-3.168-.789 3.376 3.376 0 016.338 0z" />
                  </svg>
                  Manage account</a>
                <a href="profile-information" class="text-gray-500 duration-100 ">Profile
                  information</a>
                <a href="manage-address" class="text-gray-500 duration-100 ">Manage Addresses</a>
                <a href="change-password" class="text-neutral duration-100">Change password</a>
              </div>
            </div>
          </div>
        </div>

        <div class="flex border-b py-5">
          <div class="flex w-full">
            <div class="flex flex-col gap-2">
              <a href="my-order-history" class="flex items-center gap-2 font-medium active:text-neutral">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
                  <path
                    d="M3.375 3C2.339 3 1.5 3.84 1.5 4.875v.75c0 1.036.84 1.875 1.875 1.875h17.25c1.035 0 1.875-.84 1.875-1.875v-.75C22.5 3.839 21.66 3 20.625 3H3.375z" />
                  <path fill-rule="evenodd"
                    d="M3.087 9l.54 9.176A3 3 0 006.62 21h10.757a3 3 0 002.995-2.824L20.913 9H3.087zm6.163 3.75A.75.75 0 0110 12h4a.75.75 0 010 1.5h-4a.75.75 0 01-.75-.75z"
                    clip-rule="evenodd" />
                </svg>

                My Order History</a>
            </div>
          </div>
        </div>

        <div class="flex border-b py-5">
          <div class="flex w-full">
            <div class="flex flex-col gap-2">
              <a href="payment-methods" class="flex items-center gap-2 font-medium active:text-neutral">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="h-5 w-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" />
                </svg>

                Payment Methods</a>
            </div>
          </div>
        </div>

        <div class="flex border-b py-5">
          <div class="flex w-full">
            <div class="flex flex-col gap-2">
              <a href="wishlist" class="flex items-center gap-2 font-medium active:text-neutral">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="h-5 w-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                </svg>

                My Wishlist</a>
            </div>
          </div>
        </div>

        <div class="flex py-5">
          <div class="flex w-full">
            <div class="flex flex-col gap-2">
              <a href="#" class="flex items-center gap-2 font-medium active:text-neutral">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="h-5 w-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>

                Log Out</a>
            </div>
          </div>
        </div>
      </section>
      <!-- /sidebar  -->

      <!-- form  -->
      <section class="grid w-full max-w-[1200px] grid-cols-1 gap-3 px-5 pb-10">
        <div class="py-5">
          <div class="w-full"></div>
          <form class="flex w-full flex-col gap-3" action="">
            <div class="flex w-full flex-col">
              <label class="flex" for="name">Current password<span
                  class="block text-sm font-medium text-slate-700 after:ml-0.5 after:text-red-500 after:content-['*']"></span></label>
              <input class="w-full border px-4 py-2 lg:w-1/2" type="password" placeholder="" />
            </div>

            <div class="flex w-full flex-col">
              <label class="flex" for="name">New Password<span
                  class="block text-sm font-medium text-slate-700 after:ml-0.5 after:text-red-500 after:content-['*']"></span></label>
              <input class="w-full border px-4 py-2 lg:w-1/2" type="password" placeholder="" />
            </div>

            <div class="flex flex-col">
              <label class="flex" for="">Repeat New Password<span
                  class="block text-sm font-medium text-slate-700 after:ml-0.5 after:text-red-500 after:content-['*']"></span></label>
              <input class="w-full border px-4 py-2 lg:w-1/2" type="password" placeholder="" />
            </div>

            <button class="mt-4 w-40 bg-neutral px-4 py-2 text-white">
              Save changes
            </button>
          </form>
        </div>
      </section>
      <!-- /form  -->
    </section>
  </div>
</body>

</html>
