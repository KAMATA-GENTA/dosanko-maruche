<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/_layout}">

<head></head>

<body>
  <div layout:fragment="content">

    <main>
      <h1>ユーザ登録フォーム</h1>
      <form th:action="@{/register}" th:object="${userForm}" method="post">
        <p>名前：<input type="text" th:field="*{username}" /></p>
        <p>メールアドレス：<input type="email" th:field="*{email}" /></p>
        <p>パスワード：<input type="password" th:field="*{password}" /></p>
        <p><button type="submit">登録</button></p>
      </form>

      <a href="/">▶ トップページへ戻る</a>
    </main>
  </div>
</body>
