<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/_layout}">

<head></head>

<body>
  <div layout:fragment="content">

    <!-- Burger menu  -->
    <section x-show="mobileMenuOpen" @click.outside="mobileMenuOpen = false"
      class="absolute left-0 right-0 z-50 h-screen w-full bg-white" style="display: none">
      <div class="mx-auto">
        <div class="mx-auto flex w-full justify-center gap-3 py-4">
          <a href="wishlist" class="flex cursor-pointer flex-col items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
            </svg>

            <p class="text-xs">Wishlist</p>
          </a>

          <a href="cart" class="flex cursor-pointer flex-col items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6">
              <path fill-rule="evenodd"
                d="M7.5 6v.75H5.513c-.96 0-1.764.724-1.865 1.679l-1.263 12A1.875 1.875 0 004.25 22.5h15.5a1.875 1.875 0 001.865-2.071l-1.263-12a1.875 1.875 0 00-1.865-1.679H16.5V6a4.5 4.5 0 10-9 0zM12 3a3 3 0 00-3 3v.75h6V6a3 3 0 00-3-3zm-3 8.25a3 3 0 106 0v-.75a.75.75 0 011.5 0v.75a4.5 4.5 0 11-9 0v-.75a.75.75 0 011.5 0v.75z"
                clip-rule="evenodd" />
            </svg>

            <p class="text-xs">Cart</p>
          </a>

          <a href="account-page" class="relative flex cursor-pointer flex-col items-center justify-center">
            <span class="absolute bottom-[33px] right-1 flex h-2 w-2">
              <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex h-2 w-2 rounded-full bg-red-500"></span>
            </span>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>

            <p class="text-xs">Account</p>
          </a>
        </div>

        <div class="my-4 mx-5 flex h-9 items-center border">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="mx-3 h-4 w-4">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>

          <input class="hidden w-11/12 outline-none md:block" type="search" placeholder="Search" />

          <button class="ml-auto h-full bg-amber-400 px-4 hover:bg-yellow-300">
            Search
          </button>
        </div>
        <ul class="text-center font-medium">
          <li class="py-2"><a href="index">Home</a></li>
          <li class="py-2"><a href="catalog">Catalog</a></li>
          <li class="py-2"><a href="about-us">About Us</a></li>
          <li class="py-2"><a href="contact-us">Contact Us</a></li>
        </ul>
      </div>
    </section>
    <!-- /Burger menu  -->

    <!-- Nav bar -->
    <!-- hidden on small devices -->

    <nav class="relative bg-violet-900">
      <div class="mx-auto hidden h-12 w-full max-w-[1200px] items-center md:flex">
        <button @click="desktopMenuOpen = ! desktopMenuOpen"
          class="ml-5 flex h-full w-40 cursor-pointer items-center justify-center bg-amber-400">
          <div class="flex justify-around" href="#">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="mx-1 h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>

            All categories
          </div>
        </button>

        <div class="mx-7 flex gap-8">
          <a class="font-light text-white duration-100 hover:text-yellow-400 hover:underline" href="index">Home</a>
          <a class="font-light text-white duration-100 hover:text-yellow-400 hover:underline" href="catalog">Catalog</a>
          <a class="font-light text-white duration-100 hover:text-yellow-400 hover:underline" href="about-us">About
            Us</a>
          <a class="font-light text-white duration-100 hover:text-yellow-400 hover:underline" href="contact-us">Contact
            Us</a>
        </div>

        <div class="ml-auto flex gap-4 px-5 items-center">

          <!-- ログイン済みのとき -->
          <span th:if="${isLoggedIn}" class="font-light text-white">
            こんにちは、
            <a href="/profile-information" class="font-bold text-yellow-400 hover:underline"
              th:text="${username} + 'さん'">usernameさん</a>
          </span>
          <a th:if="${isLoggedIn}" class="font-light text-white duration-100 hover:text-yellow-400 hover:underline"
            href="/logout">Logout</a>

          <!-- 未ログインのとき -->
          <a th:unless="${isLoggedIn}" class="font-light text-white duration-100 hover:text-yellow-400 hover:underline"
            href="/login">Login</a>
          <span th:unless="${isLoggedIn}" class="text-white">&#124;</span>
          <a th:unless="${isLoggedIn}" class="font-light text-white duration-100 hover:text-yellow-400 hover:underline"
            href="/sign-up">Sign Up</a>

        </div>
      </div>
    </nav>
    <!-- /Nav bar -->



    <!-- Login card  -->
    <section class="mx-auto flex-grow w-full mt-10 mb-10 max-w-[1200px] px-5">
      <div class="container mx-auto border px-5 py-5 shadow-sm md:w-1/2">
        <div class="">
          <p class="text-4xl font-bold">LOGIN</p>
          <p>Welcome back, customer!</p>
        </div>

        <form class="mt-6 flex flex-col" th:action="@{/login}" th:object="${loginForm}" method="post">
          <label for="email">Email Address</label>
          <input class="mb-3 mt-3 border px-4 py-2" th:field="*{email}" type="email"
            placeholder="youremail@domain.com" />

          <label for="email">Password</label>
          <input class="mt-3 border px-4 py-2" type="password" th:field="*{password}"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
          <button class="my-5 w-full bg-violet-900 py-2 text-white" type="submit">
            LOGIN
          </button>
        </form>

        <div class="mt-4 flex justify-between">
          <div class="flex gap-2">
            <input type="checkbox" />
            <label for="checkbox">Remember me</label>
          </div>
          <a href="#" class="text-violet-900">Forgot password</a>
        </div>



        <p class="text-center text-gray-500">OR LOGIN WITH</p>

        <div class="my-5 flex gap-2">
          <button class="w-1/2 bg-blue-800 py-2 text-white">FACEBOOK</button>
          <button class="w-1/2 bg-orange-500 py-2 text-white">GOOGLE</button>
        </div>

        <p class="text-center">
          Don`t have account?
          <a href="sign-up" class="text-violet-900">Register now</a>
        </p>
      </div>
    </section>
    <!-- /Login Card  -->

    <!-- Desktop Footer  -->
  </div>
</body>

</html>
