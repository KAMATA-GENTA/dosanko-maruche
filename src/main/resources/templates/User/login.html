<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/_layout}">

<head>
	<title>ログイン｜どさん娘マルシェ</title>
</head>

<body>
	<div layout:fragment="content">

		<main class="mx-auto w-full max-w-[1200px] px-5 py-10">
			<section class="grid gap-6 lg:grid-cols-[1fr_430px]">

				<div class="rounded-2xl border border-base-300 bg-base-100 p-8 shadow-sm md:p-11">
					<div class="badge badge-primary badge-outline mb-5">
						北海道のおいしさを、もっと身近に
					</div>

					<h1 class="text-3xl font-bold leading-snug text-base-content md:text-4xl">
						どさん娘マルシェへ<br>
						おかえりなさい
					</h1>

					<p class="mt-5 leading-8 text-base-content/70">
						ログインすると、購入履歴の確認やカート情報の管理ができます。
						北海道の特産品を、ゆっくり探していきましょう。
					</p>

					<div class="mt-8 grid gap-3 font-bold text-primary">
						<span>🚚 注文状況を確認できます</span>
						<span>🛒 カートの商品を保存できます</span>
						<span>❄ 北海道らしい商品を探せます</span>
					</div>
				</div>

				<div class="rounded-2xl border border-base-300 bg-base-100 p-7 shadow-sm md:p-8">
					<h2 class="text-3xl font-bold text-base-content">
						ログイン
					</h2>

					<p class="mt-2 text-sm text-base-content/60">
						メールアドレスとパスワードを入力してください。
					</p>

					<form class="mt-7 grid gap-4" th:action="@{/login}" th:object="${loginForm}" method="post">

						<div class="form-control">
							<label class="label" for="email">
								<span class="label-text font-bold">メールアドレス</span>
							</label>
							<input id="email" class="input input-bordered w-full" th:field="*{email}" type="email"
								placeholder="you@example.com">
						</div>

						<div class="form-control">
							<label class="label" for="password">
								<span class="label-text font-bold">パスワード</span>
							</label>
							<input id="password" class="input input-bordered w-full" th:field="*{password}"
								type="password" placeholder="パスワードを入力">
						</div>

						<button class="btn btn-primary mt-3 w-full" type="submit">
							ログイン
						</button>
					</form>

				

					<div class="mt-7 border-t border-base-300 pt-5 text-center text-sm text-base-content/60">
						<p>
							アカウントをお持ちでない方は
							<a href="/sign-up" class="font-bold text-primary">
								新規登録
							</a>
						</p>
					</div>
				</div>

			</section>
		</main>

	</div>
</body>

</html>
