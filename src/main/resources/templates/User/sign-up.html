<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/_layout}">

<head>
	<title>新規登録｜どさん娘マルシェ</title>
</head>

<body>
	<div layout:fragment="content">

		<main class="mx-auto w-full max-w-[1200px] px-5 py-10">
			<section class="grid gap-6 lg:grid-cols-[1fr_460px]">

				<div class="rounded-2xl border border-base-300 bg-base-100 p-8 shadow-sm md:p-11">
					<div class="badge badge-primary badge-outline mb-5">
						はじめての方へ
					</div>

					<h1 class="text-3xl font-bold leading-snug text-base-content md:text-4xl">
						北海道のおいしさを<br>
						あなたの食卓へ
					</h1>

					<p class="mt-5 leading-8 text-base-content/70">
						アカウントを作成すると、購入履歴の確認やカート情報の管理ができます。
						どさん娘マルシェで、北海道の魅力ある商品を見つけてください。
					</p>

					<div class="mt-8 grid gap-3 font-bold text-primary">
						<span>🛒 カート情報を管理できます</span>
						<span>📦 購入履歴を確認できます</span>
						<span>❄ 北海道らしい商品を探せます</span>
					</div>
				</div>

				<div class="rounded-2xl border border-base-300 bg-base-100 p-7 shadow-sm md:p-8">
					<h2 class="text-3xl font-bold text-base-content">
						新規登録
					</h2>
					<p class="mt-2 text-sm text-base-content/60">
						アカウント情報を入力してください。
					</p>

					<form class="mt-7 grid gap-4" th:action="@{/sign-up}" th:object="${userForm}" method="post">

						<div class="form-control">
							<label class="label" for="username">
								<span class="label-text font-bold">ユーザー名</span>
							</label>
							<input class="input input-bordered w-full" type="text" id="username" th:field="*{username}"
								placeholder="例：山田 太郎">
						</div>

						<div class="form-control">
							<label class="label" for="email">
								<span class="label-text font-bold">メールアドレス</span>
							</label>
							<input class="input input-bordered w-full" type="email" id="email" th:field="*{email}"
								placeholder="you@example.com">
						</div>

						<div class="form-control">
							<label class="label" for="password">
								<span class="label-text font-bold">パスワード</span>
							</label>
							<input class="input input-bordered w-full" type="password" id="password"
								th:field="*{password}" placeholder="パスワードを入力">
						</div>

						<div class="form-control">
							<label class="label" for="confirmPassword">
								<span class="label-text font-bold">確認用パスワード</span>
							</label>
							<input class="input input-bordered w-full" type="password" id="confirmPassword"
								placeholder="もう一度パスワードを入力">
						</div>

						<label class="mt-2 flex items-start gap-3 text-sm leading-6 text-base-content/70">
							<input type="checkbox" class="checkbox checkbox-primary checkbox-sm mt-1">
							<span>
								利用規約に同意します
							</span>
						</label>

						<button type="submit" class="btn btn-primary mt-3 w-full">
							アカウント作成
						</button>
					</form>

					<div class="mt-7 border-t border-base-300 pt-5 text-center text-sm text-base-content/60">
						<p>
							すでにアカウントをお持ちの方は
							<a href="/login" class="font-bold text-primary">
								ログイン
							</a>
						</p>
					</div>
				</div>

			</section>
		</main>

	</div>
</body>

</html>
