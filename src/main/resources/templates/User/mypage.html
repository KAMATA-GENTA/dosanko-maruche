<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>マイページ | dosanko-maruche</title>
  <style>
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>
  <main>
    <h1>マイページ</h1>
    <p>ようこそ、<span th:text="${username}">ユーザー</span> さん</p>

    <hr>

    <h2>購入履歴</h2>
    <!-- DBから取得した orderHistory リストをループして表示する想定 -->
    <table>
      <thead>
        <tr>
          <th>注文日時</th>
          <th>商品名</th>
          <th>購入価格</th>
          <th>数量</th>
        </tr>
      </thead>
      <tbody>
        <!-- 例：コントローラーから渡された orderHistory を展開 -->
        <!-- 
        <tr th:each="order : ${orderHistory}">
          <td th:text="${#dates.format(order.orderedAt, 'yyyy/MM/dd HH:mm')}"></td>
          <td th:text="${order.productName}"></td>
          <td th:text="${order.price} + '円'"></td>
          <td th:text="${order.quantity} + '個'"></td>
        </tr> 
        -->
        <tr>
          <td colspan="4">※ここに購入履歴が表示されます</td>
        </tr>
      </tbody>
    </table>

    <h2>地域別の購入数</h2>
    <!-- DBから取得した regionCounts リストをループして表示する想定 -->
    <ul>
        <!-- 例：
        <li th:each="region : ${regionCounts}">
          地域ID <span th:text="${region.regionId}"></span> : 
          <span th:text="${region.totalQuantity}"></span> 個
        </li>
        -->
        <li>※ここに各地域の購入数が表示されます（例: 地域ID 1 : 5個）</li>
    </ul>

    <hr>

    <p><a th:href="@{/logout}" style="color: red;">▶ ログアウト</a></p>

  </main>
</body>
</html>
