<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>どさん娘マルシェ</title>

	<link rel="stylesheet" href="/css/output.css">
	<link rel="stylesheet" href="/css/home.css">

	<style>
		body {
			background: hsl(var(--b2));
			color: hsl(var(--bc));
		}

		a {
			text-decoration: none;
		}

		.header {
			background: hsl(var(--b1));
			border-bottom: 1px solid hsl(var(--b3));
			box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
		}

		.logo a {
			color: hsl(var(--p));
			font-weight: 700;
		}

		.nav a {
			color: hsl(var(--bc));
			transition: .2s;
		}

		.nav a:hover {
			color: hsl(var(--p));
		}

		.header-menu a {
			border: 1px solid hsl(var(--p));
			color: hsl(var(--p));
			border-radius: 8px;
			transition: .2s;
		}

		.header-menu a:hover {
			background: hsl(var(--p));
			color: hsl(var(--pc));
		}

		h2 {
			color: hsl(var(--p));
			font-weight: 700;
		}

		.ranking-category {
			background: hsl(var(--b1));
			border: 1px solid hsl(var(--b3));
			border-radius: 18px;
			box-shadow: 0 4px 18px rgba(0, 0, 0, .04);
		}

		.ranking-category h3 {
			color: hsl(var(--p));
			font-weight: 700;
		}

		.ranking-card,
		.product-card {
			background: hsl(var(--b1));
			border: 1px solid hsl(var(--b3));
			border-radius: 16px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, .04);
			transition: .2s;
		}

		.ranking-card:hover,
		.product-card:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 22px rgba(0, 0, 0, .07);
		}

		.ranking-card img,
		.product-card img {
			object-fit: contain;
		}

		.rank {
			background: hsl(var(--p));
			color: hsl(var(--pc));
			border-radius: 999px;
			font-weight: 700;
		}

		.price {
			color: hsl(var(--p));
			font-weight: 800;
		}

		.ranking-card a,
		.product-card a {
			background: hsl(var(--p));
			color: hsl(var(--pc));
			border-radius: 8px;
			transition: .2s;
		}

		.ranking-card a:hover,
		.product-card a:hover {
			opacity: .88;
		}

		.category-card {
			border: 1px solid hsl(var(--p));
			color: hsl(var(--p));
			border-radius: 999px;
			transition: .2s;
		}

		.category-card:hover,
		.category-card.active {
			background: hsl(var(--p));
			color: hsl(var(--pc));
		}
	</style>
</head>

<body>

	<header class="header">

		<div class="logo">
			<a href="/">❄ どさん娘マルシェ</a>
		</div>

		<nav class="nav">
			<ul>
				<li><a href="/">TOP</a></li>
				<li><a href="/region/1">札幌</a></li>
				<li><a href="/region/2">小樽</a></li>
				<li><a href="/region/3">函館</a></li>
				<li><a href="/region/4">北見</a></li>
				<li><a href="/region/5">帯広</a></li>
				<li><a href="/region/6">稚内</a></li>
				<li><a href="/history">購入履歴</a></li>
			</ul>
		</nav>

		<div class="header-menu">
					<!-- ログインしていない場合 -->
					<th:block th:if="${session.username == null}">
						<a href="/login">ログイン</a>
						<a href="/cart">カート</a>
					</th:block>
					
					<!-- ログインしている場合 -->
					<th:block th:if="${session.username != null}">
						<span style="color: hsl(var(--p)); font-weight: bold; margin-right: 10px;">
							ようこそ、<span th:text="${session.username}"></span>さん
						</span>
						<a href="/cart">カート</a>
					</th:block>
				</div>

	</header>

	<section class="hero">
		<div class="hero-background">
			<img src="/images/hokkaido-bg.png" alt="北海道背景">
		</div>
	</section>

	<h2>カテゴリ別ランキング</h2>

	<div class="ranking-carousel">

		<div class="ranking-category">
			<h3>海産物ランキング</h3>

			<div class="ranking-list">
				<div class="ranking-card" th:each="product, stat : ${seafoodRanking}">
					<span class="rank" th:text="${stat.index + 1} + '位'">1位</span>
					<img th:src="${product.imageUrl}" alt="商品画像">
					<h4 th:text="${product.productName}">商品名</h4>
					<p th:text="${product.regionName}">地域名</p>
					<p class="price" th:text="'¥' + ${product.price}">¥0</p>
					<a th:href="@{/products/{id}(id=${product.id})}">詳細を見る</a>
				</div>
			</div>
		</div>

		<div class="ranking-category">
			<h3>畜産物ランキング</h3>

			<div class="ranking-list">
				<div class="ranking-card" th:each="product, stat : ${meatRanking}">
					<span class="rank" th:text="${stat.index + 1} + '位'">1位</span>
					<img th:src="${product.imageUrl}" alt="商品画像">
					<h4 th:text="${product.productName}">商品名</h4>
					<p th:text="${product.regionName}">地域名</p>
					<p class="price" th:text="'¥' + ${product.price}">¥0</p>
					<a th:href="@{/products/{id}(id=${product.id})}">詳細を見る</a>
				</div>
			</div>
		</div>

		<div class="ranking-category">
			<h3>農産物ランキング</h3>

			<div class="ranking-list">
				<div class="ranking-card" th:each="product, stat : ${vegetableRanking}">
					<span class="rank" th:text="${stat.index + 1} + '位'">1位</span>
					<img th:src="${product.imageUrl}" alt="商品画像">
					<h4 th:text="${product.productName}">商品名</h4>
					<p th:text="${product.regionName}">地域名</p>
					<p class="price" th:text="'¥' + ${product.price}">¥0</p>
					<a th:href="@{/products/{id}(id=${product.id})}">詳細を見る</a>
				</div>
			</div>
		</div>

		<div class="ranking-category">
			<h3>お土産ランキング</h3>

			<div class="ranking-list">
				<div class="ranking-card" th:each="product, stat : ${souvenirRanking}">
					<span class="rank" th:text="${stat.index + 1} + '位'">1位</span>
					<img th:src="${product.imageUrl}" alt="商品画像">
					<h4 th:text="${product.productName}">商品名</h4>
					<p th:text="${product.regionName}">地域名</p>
					<p class="price" th:text="'¥' + ${product.price}">¥0</p>
					<a th:href="@{/products/{id}(id=${product.id})}">詳細を見る</a>
				</div>
			</div>
		</div>

	</div>

	<div class="category-list">

		<a href="/#product-section" class="category-card" th:classappend="${selectedCategoryId == null} ? ' active'">
			すべて
		</a>

		<a href="/?categoryId=1#product-section" class="category-card"
			th:classappend="${selectedCategoryId == 1} ? ' active'">
			海産物
		</a>

		<a href="/?categoryId=3#product-section" class="category-card"
			th:classappend="${selectedCategoryId == 3} ? ' active'">
			畜産物
		</a>

		<a href="/?categoryId=2#product-section" class="category-card"
			th:classappend="${selectedCategoryId == 2} ? ' active'">
			農産物
		</a>

		<a href="/?categoryId=4#product-section" class="category-card"
			th:classappend="${selectedCategoryId == 4} ? ' active'">
			お土産
		</a>

	</div>

	<div id="product-section" class="product-list">

		<div class="product-card" th:each="product : ${products}">

			<img th:src="${product.imageUrl}" alt="商品画像">

			<h3 th:text="${product.name}">
				商品名
			</h3>

			<p class="price" th:text="'¥' + ${product.price}">
				¥0
			</p>

			<a th:href="@{/products/{id}(id=${product.id})}">
				詳細を見る
			</a>

		</div>

	</div>

</body>

</html>
