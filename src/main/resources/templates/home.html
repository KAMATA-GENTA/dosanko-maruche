<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どさん娘マルシェ</title>

    <link rel="stylesheet" href="/css/home.css">
</head>

<body>

<header class="header">
    <div class="logo">
        <a href="/">どさん娘マルシェ</a>
    </div>

    <nav class="nav">
        <ul>
            <li><a href="/">TOP</a></li>
            <li><a href="/region/1">札幌</a></li>
            <li><a href="/region/2">小樽</a></li>
            <li><a href="/region/3">函館</a></li>
            <li><a href="/region/4">北見</a></li>
            <li><a href="/region/5">帯広</a></li>
            <li><a href="/region/6">稚内</a></li>
            <li><a href="/history">購入履歴</a></li>
        </ul>
    </nav>

    <div class="header-menu">
        <a href="/login">ログイン</a>
        <a href="/signup">新規登録</a>
        <a href="/cart">カート</a>
    </div>
</header>


<!-- ヒーローセクション -->
<section class="hero">
    <div class="hero-background">
        <img src="/images/hokkaido-bg.png" alt="北海道背景">
    </div>
</section>


<!-- カテゴリ別ランキング -->
<section class="ranking-section">

    <h2>カテゴリ別ランキング</h2>

    <div class="ranking-carousel">

        <div class="ranking-category">
            <h3>海産物ランキング</h3>

            <div class="ranking-list">
                <div class="ranking-card"
                     th:each="product, stat : ${seafoodRanking}">

                    <span class="rank" th:text="${stat.index + 1} + '位'">1位</span>

                    <img th:src="${product.imageUrl}" alt="商品画像">

                    <h4 th:text="${product.productName}">商品名</h4>

                    <p th:text="${product.regionName}">地域名</p>

                    <p class="price" th:text="'¥' + ${product.price}">¥0</p>

                    <a th:href="@{/products/{id}(id=${product.id})}">
                        詳細を見る
                    </a>

                </div>
            </div>
        </div>

        <div class="ranking-category">
            <h3>畜産物ランキング</h3>

            <div class="ranking-list">
                <div class="ranking-card"
                     th:each="product, stat : ${meatRanking}">

                    <span class="rank" th:text="${stat.index + 1} + '位'">1位</span>

                    <img th:src="${product.imageUrl}" alt="商品画像">

                    <h4 th:text="${product.productName}">商品名</h4>

                    <p th:text="${product.regionName}">地域名</p>

                    <p class="price" th:text="'¥' + ${product.price}">¥0</p>

                    <a th:href="@{/products/{id}(id=${product.id})}">
                        詳細を見る
                    </a>

                </div>
            </div>
        </div>

        <div class="ranking-category">
            <h3>農産物ランキング</h3>

            <div class="ranking-list">
                <div class="ranking-card"
                     th:each="product, stat : ${vegetableRanking}">

                    <span class="rank" th:text="${stat.index + 1} + '位'">1位</span>

                    <img th:src="${product.imageUrl}" alt="商品画像">

                    <h4 th:text="${product.productName}">商品名</h4>

                    <p th:text="${product.regionName}">地域名</p>

                    <p class="price" th:text="'¥' + ${product.price}">¥0</p>

                    <a th:href="@{/products/{id}(id=${product.id})}">
                        詳細を見る
                    </a>

                </div>
            </div>
        </div>

        <div class="ranking-category">
            <h3>お土産ランキング</h3>

            <div class="ranking-list">
                <div class="ranking-card"
                     th:each="product, stat : ${souvenirRanking}">

                    <span class="rank" th:text="${stat.index + 1} + '位'">1位</span>

                    <img th:src="${product.imageUrl}" alt="商品画像">

                    <h4 th:text="${product.productName}">商品名</h4>

                    <p th:text="${product.regionName}">地域名</p>

                    <p class="price" th:text="'¥' + ${product.price}">¥0</p>

                    <a th:href="@{/products/{id}(id=${product.id})}">
                        詳細を見る
                    </a>

                </div>
            </div>
        </div>
    </div>
</section>


<!-- 商品カテゴリ -->
<section class="category-section">
    <h2>カテゴリから探す</h2>

    <div class="category-list">

		<a href="/#product-section"
		   class="category-card"
		   th:classappend="${selectedCategoryId == null} ? ' active'">
		    すべて
		</a>

		<a href="/?categoryId=1#product-section"
		   class="category-card"
		   th:classappend="${selectedCategoryId == 1} ? ' active'">
		    海産物
		</a>

		<a href="/?categoryId=3#product-section"
		   class="category-card"
		   th:classappend="${selectedCategoryId == 3} ? ' active'">
		    畜産物
		</a>

		<a href="/?categoryId=2#product-section"
		   class="category-card"
		   th:classappend="${selectedCategoryId == 2} ? ' active'">
		    農産物
		</a>

		<a href="/?categoryId=4#product-section"
		   class="category-card"
		   th:classappend="${selectedCategoryId == 4} ? ' active'">
		    お土産
		</a>
    </div>
</section>


<!-- 商品一覧 -->
<section class="product-section" id="product-section">
    <h2>商品一覧</h2>

    <div class="product-list">

        <div class="product-card"
             th:each="product : ${products}">

            <img th:src="${product.imageUrl}" alt="商品画像">

            <h3 th:text="${product.name}">
                商品名
            </h3>
<!--
            <p th:text="${product.regionName}">
                地域
            </p>
-->
            <p class="price"
               th:text="'¥' + ${product.price}">
                ¥0
            </p>

            <a th:href="@{/products/{id}(id=${product.id})}">
                詳細を見る
            </a>

        </div>

    </div>
</section>

</body>
</html>
